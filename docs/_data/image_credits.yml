# Source credits for essay images, keyed by file name. Nothing here appears in
# the essays themselves: the layout hands this to the page, which attaches the
# credit to the matching image as a caption revealed on hover and as a native
# tooltip. An image with no entry, or with an empty `source`, gets no credit --
# that is the right state for my own figures. An image can name a different key
# with a `data-credit` attribute; otherwise its file name is used.
#
# Still unattributed, because the file's origin does not identify its author.
# Fill in `source` and these start appearing:
#   logic-theorist.png    saved from an X/Twitter post
#   gpt1-essay.png        screenshot, original context unrecorded
#   gpt-next-token.png    screenshot, original context unrecorded

