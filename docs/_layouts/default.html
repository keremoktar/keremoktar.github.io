<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ page.title | default: site.title }}</title>
{% seo title=false %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->
    {% include head-custom.html %}

  <body>
    <div class="wrapper">
      <header>
        <span class="site-title">{{ site.title }}</span>
        <img src="{{site.logo | relative_url}}" width="185" height="243" alt="Kerem Oktar" class="site-logo" />
        <h3 class="affiliation"><span>Postdoctoral Researcher,</span><br><span>Meta FAIR</span></h3>
        <p class="credential">PhD in Psychology, Princeton</p>
        <nav aria-label="Profile links">
          <a href="https://keremoktar.com/assets/Academic_CV.pdf">CV</a> ·
          <a target="_blank" rel="noopener noreferrer" href="https://scholar.google.com/citations?user=wBVlDlYAAAAJ&amp;hl=en">Scholar</a> ·
          <a target="_blank" rel="noopener noreferrer" href="https://github.com/keremoktar">GitHub</a> ·
          <a target="_blank" rel="noopener noreferrer" href="https://www.linkedin.com/in/kerem-oktar">LinkedIn</a> ·
          <a target="_blank" rel="noopener noreferrer" href="https://bsky.app/profile/keremoktar.bsky.social">Bluesky</a> ·
          <a target="_blank" rel="noopener noreferrer" href="https://x.com/keremoktar">X</a> ·
          <a href="mailto:oktar.research@gmail.com">Email</a>
        </nav>
        <nav class="section-nav" aria-label="Homepage sections">
          <a href="/#selected-work">Selected Work</a>
          <a href="/#recent-research"><span class="nav-label-wide">Recent Research</span><span class="nav-label-compact">Recent</span></a>
          <a href="/#about">About</a>
          <a href="/#contact">Contact</a>
          <a href="/#writing">Writing</a>
        </nav>
      </header>
      <section>

      {{ content }}

      </section>
    </div>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
  </body>
</html>
